[project]
name = "kyoto"
version = "0.1.0"
description = "Enterprise Codebase Q&A + Auto-Debugger"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "anthropic>=0.25.0",

    # Vector DB
    "pinecone>=5.0.0",

    # Embeddings
    "voyageai>=0.2.0",

    # Code parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",

    # Git ingestion
    "gitpython>=3.1.40",
    "PyGithub>=2.1.1",

    # Sparse search
    "rank-bm25>=0.2.2",

    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Async + task queue
    "celery>=5.3.6",
    "redis>=5.0.3",

    # Env + config
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.1",

    # Re-ranking
    "sentence-transformers>=2.7.0",

    # Utilities
    "tenacity>=8.2.3",
    "rich>=13.7.1",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.4.1",
    "ragas>=0.1.9",
    "datasets>=2.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]